server {
    server_name pokercards.ericsantos.eu;

    root  /var/www/pokercards.ericsantos.eu;
    index index.html;

    # API e WebSocket vão direto pro binário Go nativo (systemd --user, sem container).
    location /api/ {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # Vue Router usa history mode — qualquer outra rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pokercards.ericsantos.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pokercards.ericsantos.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = pokercards.ericsantos.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pokercards.ericsantos.eu;
    return 404; # managed by Certbot
}
