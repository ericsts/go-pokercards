name: Deploy para Droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"

      - name: Build backend
        working-directory: backend
        run: GOOS=linux GOARCH=amd64 go test ./... && GOOS=linux GOARCH=amd64 go build -o pokercards-backend ./cmd/server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Enviar backend
        run: |
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            backend/pokercards-backend \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_BACKEND_PATH }}/

      - name: Enviar frontend
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            frontend/dist/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_FRONTEND_PATH }}/

      - name: Reiniciar serviço
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} \
            "chmod +x ${{ vars.DEPLOY_BACKEND_PATH }}/pokercards-backend && XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user restart pokercards"

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
